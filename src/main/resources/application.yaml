spring:
  application:
    name: mbn-knews
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/kculture?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:kculture}
    password: ${DB_PASSWORD:local-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  admin:
    api-key: ${ADMIN_API_KEY:}
  rss:
    enabled: ${RSS_ENABLED:true}
    entertainment-url: ${RSS_ENTERTAINMENT_URL:https://www.mbn.co.kr/rss/enter/}
    interval-ms: ${RSS_INTERVAL_MS:300000}
    initial-delay-ms: ${RSS_INITIAL_DELAY_MS:10000}
  naver-news:
    base-url: ${NAVER_API_BASE_URL:https://naverapihub.apigw.ntruss.com}
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
